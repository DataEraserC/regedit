# sample-apt.conf —— apt 配置格式示例
# 嵌套块 + :: 命名空间键 + 分号赋值（50appstream 风格）
Acquire::IndexTargets {
    # YAML metadata files
    deb::DEP-11 {
        MetaKey "$(COMPONENT)/dep11/Components-$(NATIVE_ARCHITECTURE).yml";
        ShortDescription "Components-$(NATIVE_ARCHITECTURE)";
        KeepCompressed "true";
        KeepCompressedAs "gz";
    };
    deb::DEP-11-icons {
        MetaKey "$(COMPONENT)/dep11/icons-64x64.tar";
        KeepCompressed "true";
        DefaultEnabled "false";
    };
};

# Refresh AppStream cache
APT::Update::Post-Invoke-Success {
    "if test -e /usr/bin/appstreamcli; then appstreamcli refresh; fi";
};
